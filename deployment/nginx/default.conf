map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_host;
    ~.+ $http_x_forwarded_host;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS keeps the app target current when the PHP-FPM
    # container is recreated. The variable makes nginx resolve it at request
    # time instead of caching the old container IP at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_fastcgi_upstream app:9000;

    client_max_body_size 66m;
    server_tokens off;

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PREFIX /;
        fastcgi_pass $app_fastcgi_upstream;
    }

    location ^~ /storage/ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
