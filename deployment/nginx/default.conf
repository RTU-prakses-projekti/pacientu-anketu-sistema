map $http_x_forwarded_proto $header_forwarded_proto {
    default "";
    ~*^https$ https;
    ~*^http$ http;
}

# Cloudflare forwards the original browser scheme in CF-Visitor. The origin
# connection from cloudflared to nginx is HTTP, so $scheme alone is not the
# browser scheme for a Quick Tunnel request.
map $http_cf_visitor $cloudflare_forwarded_proto {
    default "";
    ~*scheme.*https https;
    ~*scheme.*http http;
}

# Use the host supplied by the outer proxy when it is present. This keeps the
# Quick Tunnel detection aligned with the host Laravel receives as forwarded.
map $http_x_forwarded_host $forwarded_host {
    default $http_host;
    ~.+ $http_x_forwarded_host;
}

# Quick Tunnel reaches nginx over HTTP, while the browser reaches the
# trycloudflare.com hostname over HTTPS. Keep this host-specific fallback
# limited to Quick Tunnel requests; direct localhost traffic still uses the
# actual nginx connection scheme.
map $forwarded_host $quick_tunnel_forwarded_proto {
    default "";
    ~*\.trycloudflare\.com(?::[0-9]+)?$ https;
}

map "$quick_tunnel_forwarded_proto:$cloudflare_forwarded_proto:$header_forwarded_proto" $forwarded_proto {
    default $scheme;
    ~^https: https;
    ~^:https: https;
    ~^::https$ https;
    ~^http: http;
    ~^:http: http;
    ~^::http$ http;
}

map $http_host $request_port {
    default $server_port;
    ~^[^:]+:(?<host_port>[0-9]+)$ $host_port;
}

map "$forwarded_proto:$request_port" $forwarded_port {
    default $request_port;
    ~^https: 443;
}

log_format public_proxy_debug '$remote_addr [$time_local] "$request" $status '
    'raw_host="$http_host" x_forwarded_host="$http_x_forwarded_host" '
    'x_forwarded_proto="$http_x_forwarded_proto" cf_visitor="$http_cf_visitor" '
    'effective_forwarded_host="$forwarded_host" final_forwarded_proto="$forwarded_proto"';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS keeps the app target current when the PHP-FPM
    # container is recreated. The variable makes nginx resolve it at request
    # time instead of caching the old container IP at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_fastcgi_upstream app:9000;

    client_max_body_size 66m;
    server_tokens off;
    access_log /var/log/nginx/access.log public_proxy_debug;

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PREFIX /;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_pass $app_fastcgi_upstream;
    }

    location ^~ /storage/ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
